# Builds the self-hosted server images whenever the `test` or `live` branch changes.
# Portainer on the Umbrel pulls the new images automatically.
name: Build server images

on:
  push:
    branches: [test, live, walkers-design-handover]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-updater:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test update safety checks
        run: python -m unittest discover -s deploy -p test_paneltec_updater.py
      - name: Prepare disposable Docker fixture
        run: docker pull python:3.11-slim
      - name: Test real container replacement and rollback
        run: python -m unittest discover -s deploy -p test_updater_docker.py
  build:
    needs: verify-updater
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: [backend, web, updater]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: n
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - id: stamp
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "when=$(TZ=Australia/Hobart date '+%d/%m %H:%M')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.n.outputs.name }}:${{ github.ref_name }}
            ${{ steps.n.outputs.name }}:${{ github.ref_name }}-${{ github.sha }}
          build-args: |
            BUILD_STAMP=${{ github.ref_name }} · ${{ steps.stamp.outputs.sha }} · ${{ steps.stamp.outputs.when }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
