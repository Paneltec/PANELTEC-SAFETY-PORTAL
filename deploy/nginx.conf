server {
  listen 80;
  server_name _;
  client_max_body_size 500m;
  root /usr/share/nginx/html;

  # API → backend container
  location /api/ {
    proxy_pass http://backend:8001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # Phone app (web build for the phone viewer)
  location /m/ {
    try_files $uri $uri.html $uri/index.html /m/index.html;
  }

  # Never cache the service worker or index so updates show straight away
  location = /service-worker.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /static/ { expires 30d; add_header Cache-Control "public, immutable"; }

  # Web portal (single-page app)
  location / {
    try_files $uri /index.html;
  }
}
